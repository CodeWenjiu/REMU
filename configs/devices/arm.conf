# Arm group: MuJoCo-driven arm device; instantiating it also opens the armview
# monitor window.
#
# By default the built-in 3-DOF toy arm loads. Point REMU_ARM_MODEL at an MJCF
# file to load a real model instead, e.g. the MuJoCo Menagerie Panda
# (exported by the dev shell):
#   REMU_ARM_MODEL=$MUJOCO_MENAGERIE_DIR/franka_emika_panda/scene.xml
#
# Reference via `--dev-addon configs/devices/arm.conf`. The address matches the
# embedded HAL (remu_app/hal/remu_hal_embedded/src/addresses.rs):
#   ARM_BASE = 0x8A00_0000
arm@0x8A00_0000