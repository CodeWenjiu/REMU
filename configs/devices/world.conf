# World group: MuJoCo world devices sharing one simulation session — the arm
# actuator rig and the scan sensor (the world is created on demand and both
# attach to it; see `remu_state`'s WorldHost).
#
# Reference via `--dev-addon configs/devices/world.conf`. The addresses match
# the embedded HAL (remu_app/hal/remu_hal_embedded/src/addresses.rs):
#   ARM_BASE  = 0x8A00_0000
#   SCAN_BASE = 0x8B00_0000
arm@0x8A00_0000
scan@0x8B00_0000