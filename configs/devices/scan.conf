# Scan device: a 64-ray planar laser fan over the shared MuJoCo world (the
# same model the arm device drives — both see one session and one commit
# sequence). One frame per committed step, refreshed lazily when read; rays
# that see nothing report RANGE_MAX.
#
# Reference via `--dev-addon configs/devices/scan.conf`. The address matches
# the embedded HAL (remu_app/hal/remu_hal_embedded/src/addresses.rs):
#   SCAN_BASE = 0x8B00_0000
scan@0x8B00_0000