# Display group: framebuffer + mouse + keyboard input devices.
#
# Reference via `--dev-addon configs/devices/display.conf`. The addresses match
# the default values used by the embedded HAL (remu_app/remu_hal/embedded/src/addresses.rs):
#   DISPLAY_BASE   = 0x8800_0000
#   MOUSE_BASE     = 0x8800_1000
#   KEYBOARD_BASE  = 0x8800_2000
display@0x8800_0000
mouse@0x8800_1000
keyboard@0x8800_2000
