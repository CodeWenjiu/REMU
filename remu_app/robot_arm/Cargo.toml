[package]
name = "remu_app_robot_arm"
version = "0.1.0"
edition = "2024"

[dependencies]
remu_hal = { path = "../remu_hal" }
# sin for the per-joint sweep motion (no_std has no float intrinsics).
libm = "0.2"

[lints]
workspace = true

[[bin]]
name = "remu_app_robot_arm"
path = "../remu_hal/embedded/templates/app_entry.rs"

[package.metadata.remu]
# MJCF path relative to $MUJOCO_MENAGERIE_DIR; xtask exports REMU_ARM_MODEL
# for `just run-app` (remu and host) — a caller-set value wins.
arm-model = "franka_emika_panda/scene.xml"