[package]
name = "remu_hal"
version = "0.1.0"
edition = "2024"

[dependencies]
remu_macro = { path = "../../remu_macro" }
remu_hal_macros = { path = "./macros" }
embedded-io = "0.7.1"

[target.'cfg(target_os = "none")'.dependencies]
remu_hal_embedded = { path = "./embedded" }

# Hosted OS (linux/macos/windows/BSD…). Positive family gate (not a complement),
# so a future `target_os = "rcore"` arm can be added additively.
[target.'cfg(any(unix, windows))'.dependencies]
remu_hal_host = { path = "./host" }

[lints]
workspace = true
