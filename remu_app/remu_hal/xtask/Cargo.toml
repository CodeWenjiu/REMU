[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
remu_isa = { path = "../../../remu_isa" }
remu_macro = { path = "../../../remu_macro" }
remu_types = { path = "../../../remu_types" }

clap = { workspace = true, features = ["derive", "std"] }
strum = { version = "0.28.0", features = ["derive"] }
winnow.workspace = true

[lints]
workspace = true
