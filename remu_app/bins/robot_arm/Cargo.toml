[package]
name = "remu_app_robot_arm"
version = "0.1.0"
edition = "2024"

[dependencies]
kinematics = { path = "../../libs/kinematics" }
remu_hal = { path = "../../hal/remu_hal" }
remu_macro = { path = "../../../remu_macro" }
# sin for the per-joint sweep motion (no_std has no float intrinsics).
libm = "0.2"

[build-dependencies]
# Generates `kinematics.rs` from the model named below (see `build.rs`).
mjcf = { path = "mjcf" }

[lints]
workspace = true

[[bin]]
name = "remu_app_robot_arm"
path = "../../hal/remu_hal_embedded/templates/app_entry.rs"

[package.metadata.remu]
# MJCF path relative to $MUJOCO_MENAGERIE_DIR; xtask exports REMU_ARM_MODEL
# for `just run-app` (remu and host) — a caller-set value wins. `mjcf` also
# generates the app's kinematics constants from this same model at build time.
arm-model = "franka_emika_panda/scene.xml"
# Run-model template (relative to this package): composed by xtask into
# target/app_model/ as the model the demos load — the scene above plus the
# demo obstacles (`@SCENE@` = arm-model, `@MESH@` = its assets directory).
arm-model-template = "assets/model_template.xml"