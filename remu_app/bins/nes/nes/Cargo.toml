[package]
name = "remu_app_nes"
version = "0.1.0"
edition = "2024"

[dependencies]
remu_hal = { path = "../../../hal/remu_hal" }
runes_core = { path = "../runes_core" }
remu_hal_slint = { path = "../../../hal/remu_hal_slint" }
# Direct slint dep so `slint::include_modules!()` resolves; software renderer,
# no winit backend (the app draws into the remu_hal framebuffer).
slint = { workspace = true, default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true

[[bin]]
name = "remu_app_nes"
path = "../../../hal/remu_hal_embedded/templates/app_entry.rs"
