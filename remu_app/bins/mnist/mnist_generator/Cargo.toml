[package]
name = "remu_app_mnist_generator"
version = "0.1.0"
edition = "2024"

[dependencies]
# Hosted GUI: the software renderer plus the winit backend, so it opens a real
# window without pulling the GPU stack.
slint = { workspace = true, default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software", "backend-winit"] }
env_logger = "0.11.11"

[build-dependencies]
slint-build.workspace = true

# Host-only dev tool: run via `just run-app mnist_generator <any> --platform host`.
[package.metadata.remu]
isas = ["host"]

[lints]
workspace = true
