[package]
name = "remu_app_mnist_generator"
version = "0.1.0"
edition = "2024"

[dependencies]
# Hosted GUI: the same Slint as the rest of the tree, plus the winit backend so
# it can open a real window. The workspace feature set already selects the
# software renderer (no GPU stack), and `backend-winit` brings in `std` —
# without a backend Slint has nothing to create a window with on the host.
slint = { workspace = true, features = ["backend-winit"] }
env_logger = "0.11.11"

[build-dependencies]
slint-build.workspace = true

# Host-only dev tool: run via `just run-app mnist_generator <any> --platform host`.
[package.metadata.remu]
isas = ["host"]

[lints]
workspace = true
