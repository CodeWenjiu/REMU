[workspace]
resolver = "2"
members = [
    "remu_macro",
    "remu_isa",
    "remu_logger",
    "remu_types",
    "remu_fmt",

    "remu_boot",
    "remu_cli",

    "remu_debugger",
    "remu_harness",

    "remu_simulator",
    "remu_simulator/simulators/*",

    "remu_state",
    "remu_state/mujoco",

    # App zones: a direct child of a zone becomes a member on its own, so a new
    # app/library/platform crate needs no edit here. Two rules of `members`
    # globs: a matched *directory* must contain a Cargo.toml (matched plain
    # files are ignored), and `*` covers one level — dot-directories included,
    # so a stray `.direnv`/scratch directory here breaks the workspace until
    # excluded.
    "remu_app/hal/*",
    "remu_app/libs/*",
    "remu_app/bins/*",

    # Crates under a multi-crate project group (`remu_app/bins/nes`,
    # `remu_app/bins/rcore` — see `exclude`) and app-private helpers. They must
    # stay explicit: a path reached *through* a glob is dropped by `exclude`,
    # an explicit entry is not.
    "remu_app/bins/nes/nes",
    "remu_app/bins/nes/runes_core",
    "remu_app/bins/rcore/kernel",
    "remu_app/bins/rcore/firmware",
    "remu_app/bins/mnist/mnist_generator",
    "remu_app/bins/robot_arm/mjcf",
]

# Group directories: not packages themselves, so the zone globs must not take
# them as members; the crates under them are listed above.
exclude = ["remu_app/bins/nes", "remu_app/bins/rcore"]

[workspace.lints.rust]
unreachable_pub = "warn"

[profile.dev]
opt-level = 1

[profile.dev.build-override]
opt-level = 0

[profile.release]
panic         = "abort"
incremental   = true

# Bench-only profile for more informative flamegraphs:
# - keep symbols (`debug = 1`, `strip = "none"`)
# - disable LTO so call stacks don't get flattened as aggressively
[profile.bench]
inherits = "release"
debug = 1
strip = "none"

[workspace.dependencies]
thiserror = "2.0.21"
miette = "7.6.0"
anyhow = "1.0.104"

tracing = "0.1.44"

petgraph = "0.8.3"

clap = "4.6.7"
winnow = "1.0.4"
toml = "1.1"
roxmltree = "0.21.1"
libm = "0.2"
micromath = "2.1"

rand = "0.10.3"
nanospinner = "0.3"
dlopen2 = { version = "0.9", default-features = false, features = ["wrapper", "derive"] }

winit = "0.30.13"
softbuffer = "0.4.8"
# GL context provider for the MuJoCo arm view (EGL only: works on Wayland and
# X11; MuJoCo dlopens libEGL/libGL itself, we only give it a current context).
glutin = { version = "0.32", default-features = false, features = [ "egl", "wayland" ] }

# Slint UI toolkit. The workspace pins only the version: renderer/backend
# features are declared per consumer crate, so a crate can pick its backend
# (software into a framebuffer, or OpenGL on a shared context) without forcing
# that choice on the rest of the tree.
slint = "1.18"
slint-build = "1.18"
