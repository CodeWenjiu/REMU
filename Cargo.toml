[workspace]
resolver = "2"
members = [
    "remu_macro",
    "remu_isa",
    "remu_logger",
    "remu_types",
    "remu_fmt",

    "remu_boot",
    "remu_cli",

    "remu_debugger",
    "remu_harness",

    "remu_simulator",
    "remu_simulator/simulators/remu",
    "remu_simulator/simulators/spike",
    "remu_simulator/simulators/nzea",

    "remu_state",

    "remu_app/remu_hal",
    "remu_app/remu_hal/embedded",
    "remu_app/remu_hal/xtask",
    "remu_app/remu_hal_slint",
    "remu_app/hello_world",
    "remu_app/collection",
    "remu_app/display",
    "remu_app/shader",
    "remu_app/microbench",
    "remu_app/mnist", "remu_app/mnist/mnist_generator",
    "remu_app/nes/runes_core", "remu_app/nes/nes",
    "remu_app/slint",
]

[workspace.lints.rust]
unreachable_pub = "warn"

[profile.dev]
opt-level = 1

[profile.dev.build-override]
opt-level = 0

[profile.release]
panic         = "abort"
incremental   = true

# Bench-only profile for more informative flamegraphs:
# - keep symbols (`debug = 1`, `strip = "none"`)
# - disable LTO so call stacks don't get flattened as aggressively
[profile.bench]
inherits = "release"
debug = 1
strip = "none"

[workspace.dependencies]
thiserror = "2.0.18"
miette = "7.6.0"
anyhow = "1.0.102"

tracing = "0.1.44"

petgraph = "0.8.3"

clap = "4.6.1"
winnow = "1.0.3"

rand = "0.10.1"
nanospinner = "0.1"
libloading = "0.9"

winit = "0.30.13"
softbuffer = "0.4.8"

# Slint UI toolkit. Default-features off + software renderer: renders into the
# remu_hal framebuffer on both host and embedded (no winit/femtovg system deps).
slint = { version = "1.17", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
slint-build = "1.17"
