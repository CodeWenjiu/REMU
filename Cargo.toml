[workspace]
resolver = "2"
members = [
    "remu_macro",
    "remu_isa",
    "remu_logger",
    "remu_types",
    "remu_fmt",

    "remu_boot",
    "remu_cli",

    "remu_debugger",
    "remu_harness",

    "remu_simulator",
    "remu_simulator/simulators/*",

    "remu_state",

    # Crate collections: a directory under these becomes a member on its own, so
    # a new backend or app needs no edit here. Two rules of `members` globs:
    # a matched *directory* must contain a Cargo.toml (matched plain files are
    # ignored), and `*` covers one level — dot-directories included, so a stray
    # `.direnv`/scratch directory here breaks the workspace until excluded.
    "remu_app/*",

    # Crates one level below a group directory that is not itself a package
    # (`remu_app/nes`, `remu_app/rcore` — see `exclude`). They must stay
    # explicit: a path reached *through* a glob is dropped by `exclude`, an
    # explicit entry is not.
    "remu_app/nes/nes",
    "remu_app/nes/runes_core",
    "remu_app/rcore/kernel",
    "remu_app/rcore/firmware",
    "remu_app/mnist/mnist_generator",
    "remu_app/remu_hal/embedded",
    "remu_app/remu_hal/host",
    "remu_app/remu_hal/macros",
    "remu_app/remu_hal/rcore",
    "remu_app/remu_hal/xtask",
]

# Group directories: not packages themselves, so `remu_app/*` must not take
# them as members; the crates under them are listed above.
exclude = ["remu_app/nes", "remu_app/rcore"]

[workspace.lints.rust]
unreachable_pub = "warn"

[profile.dev]
opt-level = 1

[profile.dev.build-override]
opt-level = 0

[profile.release]
panic         = "abort"
incremental   = true

# Bench-only profile for more informative flamegraphs:
# - keep symbols (`debug = 1`, `strip = "none"`)
# - disable LTO so call stacks don't get flattened as aggressively
[profile.bench]
inherits = "release"
debug = 1
strip = "none"

[workspace.dependencies]
thiserror = "2.0.18"
miette = "7.6.0"
anyhow = "1.0.102"

tracing = "0.1.44"

petgraph = "0.8.3"

clap = "4.6.1"
winnow = "1.0.3"
toml = "1.1"

rand = "0.10.1"
nanospinner = "0.1"
libloading = "0.9"

winit = "0.30.13"
softbuffer = "0.4.8"

# Slint UI toolkit. Default-features off + software renderer: renders into the
# remu_hal framebuffer on both host and embedded (no winit/femtovg system deps).
slint = { version = "1.17", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
slint-build = "1.17"
